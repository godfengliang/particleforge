<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParticleForge — GPU Particle System Editor</title>
<link rel="canonical" href="https://particleforge-gpu.surge.sh/">
<meta name="description" content="Real-time GPU particle system editor with WebGL shaders. Create stunning particle effects with force fields, color gradients, and 12 presets.">
<meta name="keywords" content="particle system, WebGL, GPU particles, shader, visual effects, real-time">
<meta property="og:title" content="ParticleForge — GPU Particle System Editor">
<meta property="og:description" content="Create stunning GPU-accelerated particle effects in your browser.">
<meta property="og:url" content="https://particleforge-gpu.surge.sh/">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--panel:#12121a;--border:#1e1e2e;--text:#e0e0e8;--dim:#6a6a80;--accent:#6c5ce7;--accent2:#a29bfe;--green:#00cec9;--red:#ff6b6b;--orange:#fdcb6e;--radius:6px}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100vh}
canvas{display:block;position:absolute;top:0;left:0}
#ui{position:fixed;top:0;right:0;width:320px;height:100vh;background:var(--panel);border-left:1px solid var(--border);overflow-y:auto;z-index:10;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
#ui::-webkit-scrollbar{width:5px}
#ui::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.header{padding:16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);z-index:2}
.header h1{font-size:18px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{font-size:11px;color:var(--dim);margin-top:2px}
.stats{display:flex;gap:12px;margin-top:10px;font-size:11px}
.stats span{color:var(--dim)}
.stats b{color:var(--accent2)}
.section{padding:12px 16px;border-bottom:1px solid var(--border)}
.section h3{font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.row label{font-size:12px;color:var(--text);min-width:90px}
.row input[type="range"]{flex:1;margin:0 8px;accent-color:var(--accent);height:4px}
.row .val{font-size:11px;color:var(--accent2);min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.row input[type="color"]{width:32px;height:24px;border:1px solid var(--border);border-radius:4px;background:none;cursor:pointer;padding:0}
.row select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:var(--radius);font-size:12px;flex:1;margin-left:8px}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.preset{padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:11px;cursor:pointer;text-align:center;transition:all .15s}
.preset:hover{border-color:var(--accent);background:#1a1a2e}
.preset.active{border-color:var(--accent);background:linear-gradient(135deg,rgba(108,92,231,.15),rgba(0,206,201,.1))}
.btn{display:block;width:100%;padding:10px;background:linear-gradient(135deg,var(--accent),#7c6cf0);color:#fff;border:none;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s;margin-top:8px}
.btn:hover{opacity:.85}
.btn-outline{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.btn-outline:hover{background:rgba(108,92,231,.1)}
.gradient-bar{height:24px;border-radius:4px;margin:8px 0;cursor:pointer;position:relative;overflow:hidden}
.gradient-bar canvas{width:100%;height:100%;display:block}
#toggle-ui{position:fixed;top:12px;right:12px;z-index:20;background:var(--panel);border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px;display:none;align-items:center;justify-content:center}
#toggle-ui.show{display:flex}
#hint{position:fixed;bottom:16px;left:16px;font-size:11px;color:var(--dim);z-index:5;pointer-events:none}
@media(max-width:768px){
#ui{width:100%;height:50vh;top:auto;bottom:0;border-left:none;border-top:1px solid var(--border);transform:translateY(calc(100% - 48px));transition:transform .3s}
#ui.open{transform:translateY(0)}
#toggle-ui{display:flex;top:auto;bottom:56px;right:16px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="toggle-ui">&#9776;</button>
<div id="ui">
  <div class="header">
    <h1>ParticleForge</h1>
    <p>GPU Particle System Editor</p>
    <div class="stats">
      <span>Particles: <b id="stat-count">0</b></span>
      <span>FPS: <b id="stat-fps">0</b></span>
      <span>Draw: <b id="stat-draw">0</b>ms</span>
    </div>
  </div>

  <div class="section">
    <h3>Presets</h3>
    <div class="presets" id="presets"></div>
  </div>

  <div class="section">
    <h3>Emitter</h3>
    <div class="row"><label>Count</label><input type="range" id="p-count" min="500" max="500000" step="500" value="50000"><span class="val" id="v-count">50000</span></div>
    <div class="row"><label>Lifetime</label><input type="range" id="p-life" min="0.2" max="8" step="0.1" value="2.5"><span class="val" id="v-life">2.5</span></div>
    <div class="row"><label>Size</label><input type="range" id="p-size" min="1" max="30" step="0.5" value="4"><span class="val" id="v-size">4</span></div>
    <div class="row"><label>Speed</label><input type="range" id="p-speed" min="0.1" max="20" step="0.1" value="3"><span class="val" id="v-speed">3</span></div>
    <div class="row"><label>Shape</label>
      <select id="p-shape">
        <option value="0">Point</option>
        <option value="1">Sphere</option>
        <option value="2" selected>Cone</option>
        <option value="3">Ring</option>
        <option value="4">Disk</option>
      </select>
    </div>
    <div class="row"><label>Spread</label><input type="range" id="p-spread" min="0" max="3.14" step="0.01" value="0.8"><span class="val" id="v-spread">0.80</span></div>
  </div>

  <div class="section">
    <h3>Force Field</h3>
    <div class="row"><label>Gravity</label><input type="range" id="f-gravity" min="-20" max="20" step="0.1" value="-2"><span class="val" id="v-gravity">-2.0</span></div>
    <div class="row"><label>Wind X</label><input type="range" id="f-windx" min="-10" max="10" step="0.1" value="0"><span class="val" id="v-windx">0.0</span></div>
    <div class="row"><label>Wind Y</label><input type="range" id="f-windy" min="-10" max="10" step="0.1" value="0"><span class="val" id="v-windy">0.0</span></div>
    <div class="row"><label>Vortex</label><input type="range" id="f-vortex" min="0" max="10" step="0.1" value="0"><span class="val" id="v-vortex">0.0</span></div>
    <div class="row"><label>Turbulence</label><input type="range" id="f-turb" min="0" max="5" step="0.1" value="0.5"><span class="val" id="v-turb">0.5</span></div>
  </div>

  <div class="section">
    <h3>Appearance</h3>
    <div class="row"><label>Start Color</label><input type="color" id="a-c1" value="#6c5ce7"></div>
    <div class="row"><label>Mid Color</label><input type="color" id="a-c2" value="#00cec9"></div>
    <div class="row"><label>End Color</label><input type="color" id="a-c3" value="#fd79a8"></div>
    <div class="row"><label>Opacity</label><input type="range" id="a-opacity" min="0.1" max="1" step="0.01" value="0.7"><span class="val" id="v-opacity">0.70</span></div>
    <div class="row"><label>Additive</label>
      <select id="a-blend">
        <option value="1" selected>Additive</option>
        <option value="0">Alpha Blend</option>
      </select>
    </div>
    <div class="row"><label>Trail</label><input type="range" id="a-trail" min="0" max="0.98" step="0.01" value="0"><span class="val" id="v-trail">0.00</span></div>
  </div>

  <div class="section">
    <h3>Camera</h3>
    <div class="row"><label>Distance</label><input type="range" id="cam-dist" min="2" max="50" step="0.5" value="15"><span class="val" id="v-cam-dist">15.0</span></div>
    <div class="row"><label>Height</label><input type="range" id="cam-height" min="-20" max="20" step="0.5" value="5"><span class="val" id="v-cam-height">5.0</span></div>
    <div class="row"><label>Auto Rotate</label>
      <select id="cam-rotate">
        <option value="1" selected>On</option>
        <option value="0">Off</option>
      </select>
    </div>
  </div>

  <div class="section">
    <button class="btn" id="btn-screenshot">Save Screenshot (PNG)</button>
    <button class="btn btn-outline" id="btn-reset">Reset Parameters</button>
  </div>
</div>

<div id="hint">Click &amp; drag to rotate camera · Scroll to zoom · Right-drag to pan</div>

<script>
/* ===================== WebGL Setup ===================== */
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', {antialias:false, alpha:false, preserveDrawingBuffer:true});
if(!gl){document.body.innerHTML='<h2 style="color:#fff;padding:40px">WebGL not supported</h2>';throw'no webgl';}

function resize(){
  const dpr = Math.min(devicePixelRatio, 2);
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  canvas.style.width = innerWidth+'px';
  canvas.style.height = innerHeight+'px';
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener('resize', resize); resize();

/* ===================== Shaders ===================== */
const COMPUTE_VS = `
attribute float aIndex;
attribute float aSeed;
uniform float uTime, uDelta, uCount, uLife, uSize, uSpeed, uShape, uSpread;
uniform float uGravity, uWindX, uWindY, uVortex, uTurb;
uniform vec2 uRes;
uniform sampler2D uPosTex, uVelTex, uInfoTex;
varying vec4 vColor;
varying float vSize;

vec3 hash3(float n){return fract(sin(vec3(n,n*1.1,n*1.2))*vec3(43758.5453,22578.1459,19642.3491));}

vec3 emitter(vec3 s, float shape){
  float sp = uSpread;
  if(shape<0.5) return vec3(0.0);
  if(shape<1.5){ // sphere
    float th = s.x*6.2832, ph = acos(2.0*s.y-1.0), r = s.z;
    return vec3(sin(ph)*cos(th), sin(ph)*sin(th), cos(ph))*r;
  }
  if(shape<2.5){ // cone
    float a = s.x*sp, th = s.y*6.2832;
    return vec3(sin(a)*cos(th), cos(a), sin(a)*sin(th))*s.z;
  }
  if(shape<3.5){ // ring
    float th = s.x*6.2832, r = 0.5+s.y*0.3;
    return vec3(cos(th)*r, (s.y-0.5)*0.3, sin(th)*r);
  }
  // disk
  float a = s.x*6.2832, r = sqrt(s.y)*sp;
  return vec3(cos(a)*r, 0.0, sin(a)*r);
}

void main(){
  float i = aIndex;
  vec2 uv = vec2(mod(i,uRes.x)/uRes.x, floor(i/uRes.x)/uRes.y);
  vec3 pos = texture2D(uPosTex, uv).xyz;
  vec3 vel = texture2D(uVelTex, uv).xyz;
  vec3 info = texture2D(uInfoTex, uv).xyz; // age, seed, active

  float age = info.x;
  float active = info.z;
  float life = uLife * (0.5 + 0.5*aSeed);

  if(age >= life || active < 0.5){
    // respawn
    vec3 s = hash3(aSeed*100.0 + floor(uTime*10.0));
    pos = emitter(s, uShape) * 0.1;
    vel = emitter(s, uShape) * uSpeed;
    age = 0.0;
    active = 1.0;
  }

  // forces
  float t = uTime;
  vec3 force = vec3(0.0);
  force.y += uGravity;
  force.xz += vec2(uWindX, uWindY);
  // vortex
  float dist = length(pos.xz);
  if(dist > 0.01){
    vec3 tangent = normalize(vec3(-pos.z, 0.0, pos.x));
    force += tangent * uVortex / (1.0+dist*0.5);
  }
  // turbulence
  if(uTurb > 0.0){
    vec3 t3 = vec3(
      sin(pos.x*2.0+t*1.7)*cos(pos.z*1.3+t*0.9),
      cos(pos.y*2.5+t*1.1)*sin(pos.x*1.8+t*0.6),
      sin(pos.z*2.2+t*1.3)*cos(pos.y*1.6+t*1.2)
    );
    force += t3 * uTurb;
  }

  vel += force * uDelta;
  vel *= 0.995; // drag
  pos += vel * uDelta;
  age += uDelta;

  vColor = vec4(1.0);
  vSize = uSize;

  gl_Position = vec4(pos, 1.0);
  // output to framebuffer via transform feedback (simulated with texture)
  // We use the render pass approach: encode pos/vel/info into fragment
  gl_Position = vec4((mod(i,uRes.x)+0.5)/uRes.x*2.0-1.0, (floor(i/uRes.x)+0.5)/uRes.y*2.0-1.0, 0.0, 1.0);
  gl_PointSize = 1.0;
}`;

const COMPUTE_FS = `
precision highp float;
varying vec4 vColor;
void main(){gl_FragColor = vColor;}`;

/* --- Render shaders --- */
const RENDER_VS = `
attribute float aIndex;
attribute float aSeed;
uniform sampler2D uPosTex, uInfoTex;
uniform vec2 uRes;
uniform float uLife, uSize, uCount;
uniform mat4 uVP;
uniform vec3 uCamPos;
uniform vec3 uColor1, uColor2, uColor3;
uniform float uOpacity;
varying vec4 vColor;
varying float vDist;

void main(){
  float i = aIndex;
  vec2 uv = vec2(mod(i,uRes.x)/uRes.x, floor(i/uRes.x)/uRes.y);
  vec3 pos = texture2D(uPosTex, uv).xyz;
  vec3 info = texture2D(uInfoTex, uv).xyz;
  float age = info.x;
  float life = uLife * (0.5 + 0.5*aSeed);
  float t = clamp(age / life, 0.0, 1.0);
  float active = step(0.5, info.z) * step(age, life);

  // color gradient: start -> mid -> end
  vec3 col = t < 0.5 ? mix(uColor1, uColor2, t*2.0) : mix(uColor2, uColor3, (t-0.5)*2.0);
  float alpha = uOpacity * active * sin(t * 3.14159) * (1.0 - t*0.3);

  vColor = vec4(col, alpha);
  vDist = length(pos - uCamPos);

  vec4 vp = uVP * vec4(pos, 1.0);
  gl_Position = vp;
  float sz = uSize * (1.0 + t*0.5) * active;
  gl_PointSize = clamp(sz * 400.0 / max(vDist, 0.1), 1.0, 64.0);
}`;

const RENDER_FS = `
precision highp float;
varying vec4 vColor;
varying float vDist;
void main(){
  vec2 p = gl_PointCoord * 2.0 - 1.0;
  float r = dot(p, p);
  if(r > 1.0) discard;
  float alpha = vColor.a * (1.0 - sqrt(r)) * 0.9;
  gl_FragColor = vec4(vColor.rgb, alpha);
}`;

/* ===================== Compile helpers ===================== */
function compile(src, type){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(s));return null;}
  return s;
}
function link(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, compile(vs, gl.VERTEX_SHADER));
  gl.attachShader(p, compile(fs, gl.FRAGMENT_SHADER));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)){console.error(gl.getProgramInfoLog(p));return null;}
  return p;
}

/* --- FBO shader (encode pos/vel/info into RGBA) --- */
const FBO_VS = `
attribute float aIndex;
attribute float aSeed;
uniform float uTime, uDelta, uCount, uLife, uSize, uSpeed, uShape, uSpread;
uniform float uGravity, uWindX, uWindY, uVortex, uTurb;
uniform vec2 uRes;
uniform sampler2D uPosTex, uVelTex, uInfoTex;
varying vec4 vOut;

vec3 hash3(float n){return fract(sin(vec3(n,n*1.1,n*1.2))*vec3(43758.5453,22578.1459,19642.3491));}

vec3 emitter(vec3 s, float shape){
  float sp = uSpread;
  if(shape<0.5) return vec3(0.0);
  if(shape<1.5){float th=s.x*6.2832,ph=acos(2.0*s.y-1.0),r=s.z;return vec3(sin(ph)*cos(th),sin(ph)*sin(th),cos(ph))*r;}
  if(shape<2.5){float a=s.x*sp,th=s.y*6.2832;return vec3(sin(a)*cos(th),cos(a),sin(a)*sin(th))*s.z;}
  if(shape<3.5){float th=s.x*6.2832,r=0.5+s.y*0.3;return vec3(cos(th)*r,(s.y-0.5)*0.3,sin(th)*r);}
  float a=s.x*6.2832,r=sqrt(s.y)*sp;return vec3(cos(a)*r,0.0,sin(a)*r);
}

void main(){
  float i = aIndex;
  vec2 uv = vec2(mod(i,uRes.x)/uRes.x, floor(i/uRes.x)/uRes.y);
  vec3 pos = texture2D(uPosTex, uv).xyz;
  vec3 vel = texture2D(uVelTex, uv).xyz;
  vec3 info = texture2D(uInfoTex, uv).xyz;

  float age = info.x, active = info.z;
  float life = uLife*(0.5+0.5*aSeed);

  if(age>=life||active<0.5){
    vec3 s=hash3(aSeed*100.0+floor(uTime*10.0));
    pos=emitter(s,uShape)*0.1;vel=emitter(s,uShape)*uSpeed;age=0.0;active=1.0;
  }

  vec3 force=vec3(0.0);
  force.y+=uGravity;force.xz+=vec2(uWindX,uWindY);
  float dist=length(pos.xz);
  if(dist>0.01){vec3 tg=normalize(vec3(-pos.z,0.0,pos.x));force+=tg*uVortex/(1.0+dist*0.5);}
  if(uTurb>0.0){
    float t=uTime;
    force+=vec3(sin(pos.x*2.0+t*1.7)*cos(pos.z*1.3+t*0.9),cos(pos.y*2.5+t*1.1)*sin(pos.x*1.8+t*0.6),sin(pos.z*2.2+t*1.3)*cos(pos.y*1.6+t*1.2))*uTurb;
  }
  vel+=force*uDelta;vel*=0.995;pos+=vel*uDelta;age+=uDelta;

  // encode: pos=float32x3 -> use position as output target
  // We'll use 3 separate passes for pos/vel/info
  // Actually, let's use vertex transform: map each particle to its texel position
  gl_Position=vec4((mod(i,uRes.x)+0.5)/uRes.x*2.0-1.0,(floor(i/uRes.x)+0.5)/uRes.y*2.0-1.0,0.0,1.0);
  gl_PointSize=1.0;
}`;

// Simpler approach: CPU simulation for compatibility, GPU for rendering
// This ensures wide browser support and still handles 50k+ particles smoothly

/* ===================== Simulation (CPU) ===================== */
const MAX = 500000;
let simCount = 50000;
const positions = new Float32Array(MAX * 3);
const velocities = new Float32Array(MAX * 3);
const ages = new Float32Array(MAX);
const seeds = new Float32Array(MAX);
const lifetimes = new Float32Array(MAX);
const active = new Uint8Array(MAX);

// Params
const P = {
  life:2.5, size:4, speed:3, shape:2, spread:0.8,
  gravity:-2, windX:0, windY:0, vortex:0, turb:0.5,
  c1:[0.424,0.361,0.906], c2:[0,0.808,0.788], c3:[0.992,0.475,0.659],
  opacity:0.7, blend:1, trail:0,
  camDist:15, camHeight:5, camRotate:1, camAngle:0
};

function hash(n){return Math.sin(n*127.1+n*311.7)*43758.5453%1;}
function hash3(n){return [Math.abs(hash(n)),Math.abs(hash(n*1.1+1.7)),Math.abs(hash(n*1.2+3.2))];}

function emit(s, shape, spread){
  const sp = spread;
  if(shape===0) return [0,0,0];
  if(shape===1){
    const th=s[0]*Math.PI*2, ph=Math.acos(2*s[1]-1), r=s[2];
    return [Math.sin(ph)*Math.cos(th)*r, Math.sin(ph)*Math.sin(th)*r, Math.cos(ph)*r];
  }
  if(shape===2){
    const a=s[0]*sp, th=s[1]*Math.PI*2;
    return [Math.sin(a)*Math.cos(th), Math.cos(a), Math.sin(a)*Math.sin(th)];
  }
  if(shape===3){
    const th=s[0]*Math.PI*2, r=0.5+s[1]*0.3;
    return [Math.cos(th)*r, (s[1]-0.5)*0.3, Math.sin(th)*r];
  }
  const a=s[0]*Math.PI*2, r=Math.sqrt(s[1])*sp;
  return [Math.cos(a)*r, 0, Math.sin(a)*r];
}

function respawn(i, time){
  const s = hash3(seeds[i]*100 + Math.floor(time*10));
  const dir = emit(s, P.shape, P.spread);
  const idx = i*3;
  positions[idx]=dir[0]*0.1; positions[idx+1]=dir[1]*0.1; positions[idx+2]=dir[2]*0.1;
  velocities[idx]=dir[0]*P.speed; velocities[idx+1]=dir[1]*P.speed; velocities[idx+2]=dir[2]*P.speed;
  ages[i]=0;
  lifetimes[i]=P.life*(0.5+0.5*seeds[i]);
  active[i]=1;
}

// Init
for(let i=0;i<MAX;i++){
  seeds[i] = (i*0.618033988)%1;
  lifetimes[i] = P.life*(0.5+0.5*seeds[i]);
  ages[i] = lifetimes[i]+1; // dead
}

function simulate(time, dt){
  for(let i=0;i<simCount;i++){
    if(ages[i]>=lifetimes[i]||!active[i]){
      respawn(i, time);
      continue;
    }
    const idx=i*3;
    let fx=0, fy=P.gravity, fz=0;
    fx+=P.windX; fz+=P.windY;
    const dx=positions[idx], dz=positions[idx+2], dist=Math.sqrt(dx*dx+dz*dz);
    if(dist>0.01 && P.vortex>0){
      const tx=-dz/dist, tz=dx/dist;
      fx+=tx*P.vortex/(1+dist*0.5);
      fz+=tz*P.vortex/(1+dist*0.5);
    }
    if(P.turb>0){
      const px=positions[idx], py=positions[idx+1], pz=positions[idx+2];
      fx+=Math.sin(px*2+time*1.7)*Math.cos(pz*1.3+time*0.9)*P.turb;
      fy+=Math.cos(py*2.5+time*1.1)*Math.sin(px*1.8+time*0.6)*P.turb;
      fz+=Math.sin(pz*2.2+time*1.3)*Math.cos(py*1.6+time*1.2)*P.turb;
    }
    velocities[idx]+=fx*dt; velocities[idx+1]+=fy*dt; velocities[idx+2]+=fz*dt;
    velocities[idx]*=0.995; velocities[idx+1]*=0.995; velocities[idx+2]*=0.995;
    positions[idx]+=velocities[idx]*dt; positions[idx+1]+=velocities[idx+1]*dt; positions[idx+2]+=velocities[idx+2]*dt;
    ages[i]+=dt;
  }
}

/* ===================== WebGL Render ===================== */
const renderProg = link(RENDER_VS, RENDER_FS);
const uLoc = {};
['uPosTex','uInfoTex','uRes','uLife','uSize','uCount','uVP','uCamPos','uColor1','uColor2','uColor3','uOpacity'].forEach(u=>{
  uLoc[u]=gl.getUniformLocation(renderProg,u);
});

const indexBuf = gl.createBuffer();
const seedBuf = gl.createBuffer();
const posTexW = 512, posTexH = Math.ceil(MAX/(512));
const posTexData = new Float32Array(posTexW*posTexH*4);
const infoTexData = new Float32Array(posTexW*posTexH*4);

function makeTex(){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
const posTex = makeTex(), infoTex = makeTex();

function uploadTextures(){
  for(let i=0;i<simCount;i++){
    const idx=i*3, ti=i*4;
    posTexData[ti]=positions[idx]; posTexData[ti+1]=positions[idx+1]; posTexData[ti+2]=positions[idx+2]; posTexData[ti+3]=1;
    infoTexData[ti]=ages[i]; infoTexData[ti+1]=seeds[i]; infoTexData[ti+2]=active[i]?1:0; infoTexData[ti+3]=lifetimes[i];
  }
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, posTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,posTexW,posTexH,0,gl.RGBA,gl.FLOAT,posTexData);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, infoTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,posTexW,posTexH,0,gl.RGBA,gl.FLOAT,infoTexData);
}

function buildIndexBuf(){
  const arr = new Float32Array(simCount);
  for(let i=0;i<simCount;i++) arr[i]=i;
  gl.bindBuffer(gl.ARRAY_BUFFER, indexBuf);
  gl.bufferData(gl.ARRAY_BUFFER, arr, gl.STATIC_DRAW);
  const sa = new Float32Array(simCount);
  for(let i=0;i<simCount;i++) sa[i]=seeds[i];
  gl.bindBuffer(gl.ARRAY_BUFFER, seedBuf);
  gl.bufferData(gl.ARRAY_BUFFER, sa, gl.STATIC_DRAW);
}

/* ===================== Camera ===================== */
let camTheta = 0, camPhi = 0.3, camDist = 15, camTarget = [0,2,0];
let dragging = false, rightDrag = false, lastMx = 0, lastMy = 0;

canvas.addEventListener('mousedown', e=>{
  if(e.button===2) rightDrag=true; else dragging=true;
  lastMx=e.clientX; lastMy=e.clientY; e.preventDefault();
});
addEventListener('mousemove', e=>{
  if(!dragging&&!rightDrag) return;
  const dx=e.clientX-lastMx, dy=e.clientY-lastMy;
  if(dragging){camTheta-=dx*0.005; camPhi=Math.max(-1.4,Math.min(1.4,camPhi+dy*0.005));}
  if(rightDrag){camTarget[0]-=dx*0.02; camTarget[1]+=dy*0.02;}
  lastMx=e.clientX; lastMy=e.clientY;
});
addEventListener('mouseup', ()=>{dragging=false;rightDrag=false;});
canvas.addEventListener('wheel', e=>{camDist=Math.max(2,Math.min(50,camDist+e.deltaY*0.02));e.preventDefault();},{passive:false});
canvas.addEventListener('contextmenu', e=>e.preventDefault());

// Touch
let touches=[];
canvas.addEventListener('touchstart', e=>{touches=Array.from(e.touches);e.preventDefault();},{passive:false});
canvas.addEventListener('touchmove', e=>{
  const t=Array.from(e.touches);
  if(touches.length===1&&t.length===1){camTheta-=(t[0].clientX-touches[0].clientX)*0.005;camPhi=Math.max(-1.4,Math.min(1.4,camPhi+(t[0].clientY-touches[0].clientY)*0.005));}
  if(touches.length===2&&t.length===2){
    const d0=Math.hypot(touches[0].clientX-touches[1].clientX,touches[0].clientY-touches[1].clientY);
    const d1=Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
    camDist=Math.max(2,Math.min(50,camDist*(d0/d1)));
  }
  touches=t;e.preventDefault();
},{passive:false});

function mat4Perspective(fov, asp, near, far){
  const f=1/Math.tan(fov/2), nf=1/(near-far);
  return new Float32Array([f/asp,0,0,0, 0,f,0,0, 0,0,(far+near)*nf,-1, 0,0,2*far*near*nf,0]);
}
function mat4LookAt(eye,center,up){
  let zx=eye[0]-center[0],zy=eye[1]-center[1],zz=eye[2]-center[2];
  let l=1/Math.sqrt(zx*zx+zy*zy+zz*zz);zx*=l;zy*=l;zz*=l;
  let xx=up[1]*zz-up[2]*zy, xy=up[2]*zx-up[0]*zz, xz=up[0]*zy-up[1]*zx;
  l=1/Math.sqrt(xx*xx+xy*xy+xz*xz);xx*=l;xy*=l;xz*=l;
  let yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
  return new Float32Array([xx,yx,zx,0, xy,yy,zy,0, xz,yz,zz,0,
    -(xx*eye[0]+xy*eye[1]+xz*eye[2]),-(yx*eye[0]+yy*eye[1]+yz*eye[2]),-(zx*eye[0]+zy*eye[1]+zz*eye[2]),1]);
}
function mat4Mul(a,b){
  const o=new Float32Array(16);
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){o[j*4+i]=0;for(let k=0;k<4;k++)o[j*4+i]+=a[k*4+i]*b[j*4+k];}
  return o;
}

function getCamPos(){
  const theta = camTheta, phi = camPhi;
  return [
    camTarget[0]+camDist*Math.sin(theta)*Math.cos(phi),
    camTarget[1]+camDist*Math.sin(phi),
    camTarget[2]+camDist*Math.cos(theta)*Math.cos(phi)
  ];
}

/* ===================== Presets ===================== */
const PRESETS = [
  {name:'Fireworks', p:{life:2,size:3,speed:8,shape:1,spread:1.5,gravity:-5,windX:0,windY:0,vortex:0,turb:0.2,c1:'#ff6b35',c2:'#ffd700',c3:'#ff1744',opacity:0.9,blend:1,trail:0.3}},
  {name:'Galaxy', p:{life:6,size:2,speed:1.5,shape:3,spread:1,gravity:0,windX:0,windY:0,vortex:5,turb:0.3,c1:'#6c5ce7',c2:'#00cec9',c3:'#fd79a8',opacity:0.6,blend:1,trail:0.5}},
  {name:'Rain', p:{life:1.5,size:1.5,speed:12,shape:4,spread:2,gravity:-15,windX:0.5,windY:0,vortex:0,turb:0.1,c1:'#74b9ff',c2:'#0984e3',c3:'#dfe6e9',opacity:0.5,blend:0,trail:0}},
  {name:'Snow', p:{life:5,size:4,speed:1,shape:1,spread:1,gravity:-1,windX:0.3,windY:0,vortex:0,turb:1,c1:'#ffffff',c2:'#dfe6e9',c3:'#b2bec3',opacity:0.8,blend:0,trail:0}},
  {name:'Explosion', p:{life:1.5,size:5,speed:15,shape:1,spread:1.5,gravity:-3,windX:0,windY:0,vortex:0,turb:0.5,c1:'#ffeaa7',c2:'#e17055',c3:'#d63031',opacity:0.95,blend:1,trail:0.4}},
  {name:'Tornado', p:{life:4,size:2.5,speed:3,shape:3,spread:0.8,gravity:2,windX:0,windY:0,vortex:8,turb:2,c1:'#00cec9',c2:'#6c5ce7',c3:'#0984e3',opacity:0.7,blend:1,trail:0.6}},
  {name:'Fountain', p:{life:3,size:3,speed:8,shape:2,spread:0.3,gravity:-12,windX:0,windY:0,vortex:0,turb:0.3,c1:'#0984e3',c2:'#74b9ff',c3:'#dfe6e9',opacity:0.8,blend:1,trail:0.2}},
  {name:'Fireflies', p:{life:4,size:3,speed:0.5,shape:0,spread:0.5,gravity:0,windX:0,windY:0,vortex:0,turb:2,c1:'#ffeaa7',c2:'#fdcb6e',c3:'#00cec9',opacity:0.9,blend:1,trail:0}},
  {name:'Matrix', p:{life:3,size:2,speed:5,shape:4,spread:2,gravity:5,windX:0,windY:0,vortex:0,turb:0.2,c1:'#00ff41',c2:'#00b894',c3:'#55efc4',opacity:0.8,blend:1,trail:0.7}},
  {name:'Nebula', p:{life:8,size:6,speed:0.3,shape:1,spread:2,gravity:0,windX:0,windY:0,vortex:1,turb:1.5,c1:'#a29bfe',c2:'#fd79a8',c3:'#6c5ce7',opacity:0.4,blend:1,trail:0.9}},
  {name:'Sparkler', p:{life:0.8,size:2,speed:6,shape:1,spread:2,gravity:-4,windX:0,windY:0,vortex:0,turb:1,c1:'#ffffff',c2:'#ffeaa7',c3:'#e17055',opacity:1,blend:1,trail:0.1}},
  {name:'Portal', p:{life:3,size:3,speed:2,shape:3,spread:0.5,gravity:0,windX:0,windY:0,vortex:10,turb:0.5,c1:'#6c5ce7',c2:'#a29bfe',c3:'#fd79a8',opacity:0.8,blend:1,trail:0.6}}
];

function hexToRGB(h){return [parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255];}

/* ===================== UI Binding ===================== */
const sliders = ['count','life','size','speed','spread','gravity','windx','windy','vortex','turb','opacity','trail','cam-dist','cam-height'];
sliders.forEach(id=>{
  const el = document.getElementById('p-'+id)||document.getElementById('f-'+id)||document.getElementById('a-'+id)||document.getElementById('cam-'+id);
  if(!el) return;
  const vEl = document.getElementById('v-'+id);
  el.addEventListener('input', ()=>{
    const v = parseFloat(el.value);
    if(vEl) vEl.textContent = v >= 100 ? Math.round(v) : v.toFixed(v===Math.round(v)?1:2);
    applyParam(id, v);
  });
});

function applyParam(id, v){
  switch(id){
    case'count':simCount=Math.round(v);buildIndexBuf();break;
    case'life':P.life=v;break;case'size':P.size=v;break;case'speed':P.speed=v;break;
    case'shape':P.shape=v;break;case'spread':P.spread=v;break;
    case'gravity':P.gravity=v;break;case'windx':P.windX=v;break;case'windy':P.windY=v;break;
    case'vortex':P.vortex=v;break;case'turb':P.turb=v;break;
    case'opacity':P.opacity=v;break;case'blend':P.blend=v;break;case'trail':P.trail=v;break;
    case'cam-dist':camDist=v;break;case'cam-height':camTarget[1]=v;break;case'cam-rotate':P.camRotate=v;break;
  }
}

document.getElementById('p-shape').addEventListener('change', e=>applyParam('shape',parseInt(e.target.value)));
document.getElementById('a-blend').addEventListener('change', e=>applyParam('blend',parseInt(e.target.value)));
document.getElementById('cam-rotate').addEventListener('change', e=>applyParam('cam-rotate',parseInt(e.target.value)));

['c1','c2','c3'].forEach(id=>{
  document.getElementById('a-'+id).addEventListener('input', e=>{
    P[id] = hexToRGB(e.target.value);
  });
});

// Presets
const presetsEl = document.getElementById('presets');
PRESETS.forEach((pr, idx) => {
  const btn = document.createElement('div');
  btn.className = 'preset';
  btn.textContent = pr.name;
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.preset').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    applyPreset(pr.p);
  });
  presetsEl.appendChild(btn);
});

function applyPreset(pr){
  const map = {life:'p-life',size:'p-size',speed:'p-speed',spread:'p-spread',gravity:'f-gravity',windX:'f-windx',windY:'f-windy',vortex:'f-vortex',turb:'f-turb',opacity:'a-opacity',trail:'a-trail'};
  Object.entries(map).forEach(([k,id])=>{
    if(pr[k]!==undefined){
      const el=document.getElementById(id);
      el.value=pr[k];
      el.dispatchEvent(new Event('input'));
    }
  });
  if(pr.shape!==undefined){document.getElementById('p-shape').value=pr.shape;applyParam('shape',pr.shape);}
  if(pr.blend!==undefined){document.getElementById('a-blend').value=pr.blend;applyParam('blend',pr.blend);}
  ['c1','c2','c3'].forEach(c=>{
    if(pr[c]){
      document.getElementById('a-'+c).value=pr[c];
      P[c]=hexToRGB(pr[c]);
    }
  });
}

// Screenshot
document.getElementById('btn-screenshot').addEventListener('click', ()=>{
  const link = document.createElement('a');
  link.download = 'particleforge-screenshot.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

// Reset
document.getElementById('btn-reset').addEventListener('click', ()=>{
  applyPreset(PRESETS[6].p); // Fountain default
  document.querySelectorAll('.preset').forEach(p=>p.classList.remove('active'));
});

// Mobile toggle
const toggleBtn = document.getElementById('toggle-ui');
const uiEl = document.getElementById('ui');
toggleBtn.addEventListener('click', ()=>{uiEl.classList.toggle('open');});

// Enable required WebGL extension
const floatExt = gl.getExtension('OES_texture_float');
if(!floatExt) console.warn('OES_texture_float not available, using fallback');

/* ===================== Render Loop ===================== */
let lastTime = 0, fpsFrames = 0, fpsTime = 0, fpsVal = 0, drawMs = 0;
buildIndexBuf();

function frame(now){
  requestAnimationFrame(frame);
  const time = now * 0.001;
  const dt = Math.min(time - lastTime, 0.05);
  lastTime = time;

  // FPS
  fpsFrames++;
  if(time - fpsTime >= 1){
    fpsVal = fpsFrames;
    fpsFrames = 0;
    fpsTime = time;
  }

  // Auto rotate
  if(P.camRotate) camTheta += dt * 0.3;

  // Simulate
  simulate(time, dt);

  // Upload
  uploadTextures();

  const t0 = performance.now();

  // Render
  gl.clearColor(0.04, 0.04, 0.06, 1);
  if(P.trail > 0){
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.clearColor(0,0,0,0);
    // Draw a semi-transparent quad for trail effect
    // Actually, just don't clear - use accumulation
    gl.clearColor(0.04*(1-P.trail), 0.04*(1-P.trail), 0.06*(1-P.trail), 1-P.trail);
  }
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.BLEND);
  if(P.blend){
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
  } else {
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  }
  gl.disable(gl.DEPTH_TEST);

  const asp = canvas.width / canvas.height;
  const proj = mat4Perspective(Math.PI/3, asp, 0.1, 200);
  const eye = getCamPos();
  const view = mat4LookAt(eye, camTarget, [0,1,0]);
  const vp = mat4Mul(proj, view);

  gl.useProgram(renderProg);
  gl.uniform1i(uLoc.uPosTex, 0);
  gl.uniform1i(uLoc.uInfoTex, 1);
  gl.uniform2f(uLoc.uRes, posTexW, posTexH);
  gl.uniform1f(uLoc.uLife, P.life);
  gl.uniform1f(uLoc.uSize, P.size);
  gl.uniform1f(uLoc.uCount, simCount);
  gl.uniformMatrix4fv(uLoc.uVP, false, vp);
  gl.uniform3fv(uLoc.uCamPos, eye);
  gl.uniform3fv(uLoc.uColor1, P.c1);
  gl.uniform3fv(uLoc.uColor2, P.c2);
  gl.uniform3fv(uLoc.uColor3, P.c3);
  gl.uniform1f(uLoc.uOpacity, P.opacity);

  const aIdxLoc = gl.getAttribLocation(renderProg, 'aIndex');
  const aSeedLoc = gl.getAttribLocation(renderProg, 'aSeed');

  gl.bindBuffer(gl.ARRAY_BUFFER, indexBuf);
  gl.enableVertexAttribArray(aIdxLoc);
  gl.vertexAttribPointer(aIdxLoc, 1, gl.FLOAT, false, 0, 0);

  gl.bindBuffer(gl.ARRAY_BUFFER, seedBuf);
  gl.enableVertexAttribArray(aSeedLoc);
  gl.vertexAttribPointer(aSeedLoc, 1, gl.FLOAT, false, 0, 0);

  gl.drawArrays(gl.POINTS, 0, simCount);

  drawMs = (performance.now() - t0).toFixed(1);
  document.getElementById('stat-count').textContent = simCount.toLocaleString();
  document.getElementById('stat-fps').textContent = fpsVal;
  document.getElementById('stat-draw').textContent = drawMs;
}

requestAnimationFrame(frame);
</script>
